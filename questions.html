<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question Vault · Belladonna Trivia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@500;700&family=DM+Sans:wght@400;500;700&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;--surface:#111111;--surface2:#181818;--surface3:#222222;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);--border3:rgba(255,255,255,.22);
  --text:#f0ede8;--text2:#b0a898;--text3:#5a5248;
  --gold:#c9a84c;--gold2:#e8c96a;--gold3:#f5df90;
  --gold-shine:linear-gradient(135deg,#c9a84c 0%,#f5df90 45%,#c9a84c 70%,#e2b84a 100%);
  --gold-dim:rgba(201,168,76,.10);--gold-glow:rgba(201,168,76,.28);--gold-glow2:rgba(201,168,76,.5);
  --red:#e74c3c;--red-dim:rgba(231,76,60,.12);
  --green:#2ecc71;--green-dim:rgba(46,204,113,.12);
  --radius:8px;--radius-lg:14px;
  --display:'Bebas Neue',sans-serif;--cinzel:'Cinzel',serif;--serif:'EB Garamond',serif;--font:'DM Sans',sans-serif;
}
body{--muted:var(--text2);--danger:var(--red);--ok:var(--green);--line:var(--border);--line2:var(--border2);--panel:var(--surface);--panel2:var(--surface2);--zebra:#0c0c0c;--focusbg:#1b1810}
body[data-theme="light"]{
  --bg:#faf6ec;--surface:#ffffff;--surface2:#f6efe0;--surface3:#ede2c8;
  --border:rgba(40,30,10,.10);--border2:rgba(40,30,10,.18);--border3:rgba(40,30,10,.28);
  --text:#2a2118;--text2:#5c4f3e;--text3:#8a7a63;
  --gold:#a97f22;--gold2:#8c6a1e;--gold3:#6e5417;
  --gold-shine:linear-gradient(135deg,#a97f22 0%,#c99a30 45%,#a97f22 70%,#93711c 100%);
  --gold-dim:rgba(169,127,34,.12);--gold-glow:rgba(169,127,34,.35);--gold-glow2:rgba(169,127,34,.6);
  --red-dim:rgba(231,76,60,.14);--green-dim:rgba(46,204,113,.16);
  --zebra:#fbf8ef;--focusbg:#f4ecd2;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:rgba(201,168,76,.25);border-radius:3px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.hidden{display:none!important}
.muted{color:var(--text3)}

/* ── sign-in hand-off screen: looks like the Belladonna gateway ── */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:#000;overflow:auto;z-index:600}
.gwWrap{width:100%;max-width:420px}
.gwLogo{display:block;margin:0 auto .9rem;width:64px;height:64px;object-fit:contain}
.gwBrand{font-family:'Bebas Neue',sans-serif;font-size:2.4rem;color:#f0ece0;letter-spacing:.08em;text-transform:uppercase;text-align:center;line-height:1}
.gwBrand .accent{color:#c9a96e}
.gwSub{font-family:'EB Garamond',serif;font-style:italic;font-size:.95rem;color:#8a8272;margin:.5rem 0 2rem;text-align:center}
.gwCard{background:#0d0d0d;border:1px solid rgba(180,150,100,.16);border-radius:10px;padding:1.75rem 1.5rem}
.gwMsg{text-align:center;color:#8a8272;font-size:.85rem;padding:.4rem 0}
.gwBtn{width:100%;background:rgba(201,169,110,.1);border:1px solid rgba(201,169,110,.4);border-radius:999px;color:#c9a96e;padding:.8rem;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;transition:all .2s}
.gwBtn:hover{background:rgba(201,169,110,.2)}
.gwFoot{text-align:center;font-size:.62rem;letter-spacing:.16em;color:#4a4638;margin-top:1.75rem;text-transform:uppercase}

/* ── NAV (same bar as the planner / trivia admin) ── */
#app{display:flex;flex-direction:column;height:100vh}
.nav{position:sticky;top:0;z-index:200;background:rgba(8,8,8,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 2rem;height:64px;flex:none;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.nav-left{display:flex;align-items:center;gap:14px}
.nav-logo-img{width:38px;height:38px;object-fit:contain}
.nav-title{font-family:var(--display);font-size:24px;letter-spacing:.06em;line-height:1;color:#f0ede8}
.nav-title span{background:var(--gold-shine);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.nav-subtitle{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--text3);margin-left:4px;padding-left:14px;border-left:1px solid var(--border2)}
.nav-right{display:flex;align-items:center;gap:10px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);flex-shrink:0;transition:background .3s}
.sync-dot.synced{background:var(--green)}
.sync-dot.syncing{background:var(--gold);animation:pulse .8s ease-in-out infinite}
.sync-dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.sync-label{font-family:var(--cinzel);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}

/* ── buttons / pills / fields ── */
.btn{font-family:var(--cinzel);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border-radius:var(--radius);padding:9px 16px;cursor:pointer;transition:all .2s;background:transparent;color:var(--text2);border:1px solid var(--border2);white-space:nowrap;text-decoration:none;display:inline-block;line-height:1.3}
.btn:hover{background:var(--surface2);color:var(--text)}
.btn.ghost{color:var(--gold);border-color:var(--gold-glow)}
.btn.ghost:hover{background:var(--gold-dim);color:var(--gold)}
.btn.primary{background:var(--gold-shine);color:#000;border:none;font-weight:600}
.btn.primary:hover{opacity:.88;background:var(--gold-shine);color:#000}
.btn.danger{color:var(--red);border-color:rgba(231,76,60,.35)}
.btn.danger:hover{background:var(--red-dim);color:var(--red)}
.btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.btn.sm{padding:5px 11px;font-size:9px}
.pill{font-family:var(--cinzel);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:transparent;border:1px solid var(--border2);border-radius:99px;padding:5px 14px;color:var(--text3);cursor:pointer;transition:all .2s;white-space:nowrap}
.pill:hover{border-color:var(--gold-glow);color:var(--gold2)}
.pill.active,.pill.on{background:var(--gold-dim);border-color:var(--gold-glow2);color:var(--gold2)}
.pill small{font-family:var(--font);letter-spacing:0;opacity:.7;margin-left:4px;font-size:10px}
.linkbtn{background:none;border:0;color:var(--text3);text-decoration:underline;padding:0;font-size:12px;font-family:var(--serif);font-style:italic;cursor:pointer;text-align:left}
.linkbtn:hover{color:var(--gold2)}
.fld{display:flex;flex-direction:column;gap:5px;margin:0 0 1rem;font-family:var(--cinzel);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.fld input,.fld select{width:100%;padding:10px 13px;background:var(--surface2);color:var(--text);border:1px solid var(--border2);border-radius:var(--radius);font:14px var(--font);letter-spacing:0;text-transform:none;outline:none;transition:border-color .2s}
.fld input:focus,.fld select:focus{border-color:var(--gold-glow2)}
.msg{min-height:18px;margin-top:8px;font-size:13px;color:var(--red)}
.msg.ok{color:var(--green)}
.hint{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--text2);margin:0 0 .9rem;line-height:1.5}
.hint strong{font-style:normal}

/* ── layout ── */
.shell{display:grid;grid-template-columns:300px 1fr;flex:1;min-height:0}
aside{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.sideTop{padding:1rem 1rem .6rem;display:flex;flex-direction:column;gap:10px}
#catSearch,#q{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);padding:9px 13px;color:var(--text);font:14px var(--font);outline:none;transition:border-color .2s}
#catSearch{width:100%}
#q{width:210px}
#catSearch:focus,#q:focus{border-color:var(--gold-glow2)}
#catSearch::placeholder,#q::placeholder{color:var(--text3)}
#catList{flex:1;overflow-y:auto;padding:2px 8px 12px}
.grpHead{display:flex;width:100%;align-items:center;gap:8px;background:none;border:0;padding:10px 8px 6px;color:var(--gold);font-family:var(--cinzel);letter-spacing:.14em;text-transform:uppercase;font-size:10px;font-weight:600;text-align:left}
.grpHead em{margin-left:auto;font-style:normal;color:var(--text3);font-family:var(--font);letter-spacing:0;font-weight:400}
.chev{display:inline-block;transition:transform .15s;font-size:9px}
.grp.closed .chev{transform:rotate(-90deg)}
.grp.closed .grpBody{display:none}
.cat{display:flex;width:100%;align-items:center;gap:8px;background:none;border:0;border-radius:var(--radius);padding:7px 10px;text-align:left;color:var(--text2);font-size:13px}
.cat:hover{background:var(--surface2);color:var(--text)}
.cat.active{background:var(--gold-dim);box-shadow:inset 2px 0 0 var(--gold);color:var(--gold2)}
.cat .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .ct{color:var(--text3);font-size:12px}
.cat.arch{opacity:.5}
.sideFoot{border-top:1px solid var(--border);padding:12px 16px;font-size:12px;color:var(--text3)}
.sideFoot label{display:flex;align-items:center;gap:7px;font-family:var(--serif);font-style:italic;font-size:13px;cursor:pointer}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
#empty{margin:auto;text-align:center;padding:40px}
#empty h3{font-family:var(--display);font-weight:400;font-size:34px;letter-spacing:.05em;background:var(--gold-shine);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
#empty div{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--text3)}
.top{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;padding:1rem 1.5rem .9rem;border-bottom:1px solid var(--border)}
.titleBlock{display:flex;align-items:center;gap:12px;min-width:0;flex-wrap:wrap}
.catTitle{font-family:var(--display);font-size:32px;letter-spacing:.05em;line-height:1.2;background:transparent;border:1px solid transparent;border-radius:var(--radius);color:var(--gold2);padding:0 8px;min-width:140px;width:min(440px,56vw);outline:none}
.catTitle:hover{border-color:var(--border2)}
.catTitle:focus{border-color:var(--gold-glow2);background:var(--surface)}
#catType{font-family:var(--cinzel);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold2);background:transparent;border:1px solid var(--gold-glow);border-radius:99px;padding:5px 12px;outline:none;cursor:pointer}
#catType option{background:var(--surface);color:var(--text)}
#catCount{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--text3)}
.tag{font-family:var(--cinzel);font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:2px 9px;border-radius:99px;border:1px solid var(--border2);color:var(--text3)}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px}
.tools .chk{display:flex;align-items:center;gap:6px;color:var(--text3);font-family:var(--serif);font-style:italic;font-size:13px;cursor:pointer}
#tagBar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:.6rem 1.5rem;border-bottom:1px solid var(--border);max-height:92px;overflow:auto}
.tagLbl{font-family:var(--cinzel);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-right:4px}
#loading{padding:22px 24px;color:var(--text3);font-family:var(--serif);font-style:italic;font-size:1.05rem}

/* ── the grid ── */
.gridWrap{flex:1;overflow:auto;position:relative;scroll-padding-top:48px;scroll-padding-left:330px;overflow-anchor:none}
table#grid{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
#grid th{position:sticky;top:0;z-index:4;background:var(--surface2);text-align:left;font-family:var(--cinzel);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:9px;color:var(--text3);padding:12px 10px;border-bottom:1px solid var(--border2);border-right:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
#grid th.num,#grid th.act{cursor:default}
td.fb,th.fb{position:sticky;left:52px;z-index:2;width:104px;min-width:104px;max-width:104px;background:var(--surface)!important;white-space:nowrap;padding:6px 6px!important;font-size:12px;vertical-align:top}
th.fb{z-index:6;background:var(--surface2)!important;cursor:default}
td.fb .star{background:none;border:0;cursor:pointer;color:var(--gold2);font-size:15px;line-height:1;padding:2px 3px;margin-right:2px}
td.fb .star:hover{color:#fff}
td.fb .fbup,td.fb .fbdn{color:var(--text2);margin-right:5px}
td.fb .fbdn.has{color:var(--red)}
#notesBtn .nb{display:inline-block;min-width:18px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--gold);color:#080808;font-weight:700;font-size:11px;text-align:center}
#notesBtn .nb.zero{display:none}
tr.flash td{background:rgba(201,168,76,.28)!important;transition:background 1s}
.nrCat{font-family:var(--cinzel);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:16px 0 6px}
.nrCard{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--surface2)}
.nrQ{font-weight:600;font-size:14px}
.nrA{color:var(--text2);font-size:13px;margin-top:2px}
.nrMeta{display:flex;gap:10px;align-items:center;margin-top:6px;font-size:12px;color:var(--text3);flex-wrap:wrap}
.nrNote{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;border-top:1px solid var(--border);margin-top:8px;padding-top:8px;font-size:13px;color:var(--text)}
.nrNote small{display:block;color:var(--text3);font-size:11px;margin-top:2px}
#grid th.dragging{opacity:.4}
#grid th.dropL{box-shadow:inset 3px 0 0 var(--gold)}
#grid th.dropR{box-shadow:inset -3px 0 0 var(--gold)}
.list .item.dragging{opacity:.4}
.list .item.dropT{box-shadow:0 -2px 0 var(--gold)}
.list .item .grab{cursor:grab;color:var(--text3);padding:0 8px 0 2px;user-select:none}
.list .item .mv{background:none;border:1px solid var(--border2);color:var(--text2);border-radius:6px;width:26px;height:26px;cursor:pointer;margin-left:4px}
.list .item .mv:hover:not(:disabled){color:var(--gold2);border-color:var(--gold)}
.list .item .mv:disabled{opacity:.3;cursor:default}
#grid th:hover:not(.num):not(.act){color:var(--gold2)}
#grid td{padding:0;border-bottom:1px solid var(--border);border-right:1px solid var(--border);vertical-align:top;background:var(--bg)}
#grid tbody tr:nth-child(even) td{background:var(--zebra)}
#grid td:focus-within{background:var(--focusbg)!important;box-shadow:inset 0 0 0 1px var(--gold-glow2)}
#grid td input[type=text],#grid td textarea,#grid td select{display:block;width:100%;background:transparent;border:0;color:var(--text);font:14px/1.35 var(--font);padding:8px 10px;outline:none;resize:none;border-radius:0}
#grid td textarea{overflow:hidden;min-height:34px}
#grid td select{appearance:none;-webkit-appearance:none;text-align:center;cursor:pointer;font-weight:700}
#grid td select option{background:var(--surface);color:var(--text)}
#grid td select.d1{color:var(--green)}#grid td select.d2{color:var(--gold2)}#grid td select.d3{color:var(--red)}
#grid td.c-check{text-align:center;padding-top:9px}
#grid td .thumb{display:block;width:100%;background:none;border:0;padding:7px 4px;font-size:16px;opacity:.9}
#grid td .thumb[data-v='']{opacity:.3}
td.num,th.num{position:sticky;left:0;z-index:2;width:52px;min-width:52px;text-align:right;color:var(--text3);padding:9px 8px 0 4px!important;font-size:12px;background:var(--surface)!important;white-space:nowrap}
th.num{z-index:6}
td.stickyQ,th.stickyQ{position:sticky;left:156px;z-index:2;box-shadow:2px 0 0 var(--border2)}
th.stickyQ{z-index:6}
tbody{counter-reset:r}
td.num .n::before{counter-increment:r;content:counter(r)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:transparent;transition:background .4s}
tr.saving .dot{background:var(--gold)}
tr.saved .dot{background:var(--green)}
tr.error .dot{background:var(--red)}
tr.draft .dot{background:var(--border3)}
tr.dup td.num{box-shadow:inset 3px 0 0 var(--red)}
tr.arch{display:none}
body.showArch tr.arch{display:table-row;opacity:.5}
tr[hidden]{display:none!important}
td.act,th.act{width:70px;min-width:70px;text-align:center;border-right:0!important}
td.act .ico{background:none;border:0;color:var(--text3);padding:6px 5px;font-size:15px;opacity:0;transition:.1s}
tr:hover td.act .ico,td.act .ico:focus{opacity:1}
td.act .ico:hover{color:var(--gold2)}
td.act .ico.del:hover{color:var(--red)}
.addBar{padding:12px 24px 60px;min-height:calc(100vh - 200px)}
.sortInd{color:var(--gold2)}

/* ── modal + toast (same as the other apps) ── */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:16px;z-index:500;backdrop-filter:blur(6px)}
#modal.open{display:flex}
.mBox{width:min(520px,95vw);max-height:90vh;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg)}
.mBox.wide{width:min(1000px,96vw)}
.mHead{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;border-bottom:1px solid var(--border)}
.mHead h2{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.06em;background:var(--gold-shine);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.mHead .x{background:none;border:0;color:var(--text3);font-size:20px;padding:2px 6px}
.mHead .x:hover{color:var(--text)}
.mBody{padding:1.5rem;overflow-y:auto}
.mFoot{display:flex;gap:8px;justify-content:flex-end;padding:1rem 1.5rem;border-top:1px solid var(--border)}
.drop{border:1.5px dashed var(--gold-glow);border-radius:var(--radius-lg);padding:18px;text-align:center;margin-bottom:1rem;background:var(--surface2)}
.drop.over{border-color:var(--gold);background:var(--gold-dim)}
table.pv{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
table.pv th{text-align:left;color:var(--text3);font-family:var(--cinzel);font-weight:600;font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:6px;border-bottom:1px solid var(--border2)}
table.pv td{padding:5px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
table.pv input,table.pv select{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:5px 8px;color:var(--text);font:inherit;outline:none}
table.pv input:focus{border-color:var(--gold-glow2)}
table.pv input.bad{border-color:var(--red)}
table.pv .bad{color:var(--red)}
table.pv .good{color:var(--green)}
table.pv tr.hit{cursor:pointer}
table.pv tr.hit:hover td{background:var(--gold-dim)}
.list{display:flex;flex-direction:column;gap:6px}
.list .item{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px}
.list .item .lb{flex:1}
.list .item small{color:var(--text3)}
.menuList{display:flex;flex-direction:column;gap:8px}
.menuList .btn{text-align:left}
#toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(10px);background:var(--surface);border:1px solid var(--gold-glow);border-radius:99px;padding:8px 20px;font-family:var(--cinzel);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);opacity:0;transition:all .3s;z-index:999;pointer-events:none;display:flex;align-items:center;gap:14px;max-width:92vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toast.error{border-color:rgba(231,76,60,.4);color:var(--red)}
#toast button{background:none;border:0;color:var(--gold2);text-decoration:underline;padding:0;font-family:var(--cinzel);font-size:11px;letter-spacing:.1em;text-transform:uppercase}

@media (max-width:820px){
  .shell{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  aside{max-height:34vh}
  .nav{height:auto;padding:8px 1rem}
  .nav-subtitle{display:none}
  .catTitle{font-size:26px}
}
</style>

  { key:'question',      label:'Question',       exportLabel:'Question',         type:'long', w:380 },

const RESERVED = new Set(['categoryId','order','archived','createdAt','updatedAt','id']);
const CUSTOM_TYPES = { text:'Short text', long:'Long text / notes', thumbs:'Thumbs up / down', check:'Checkbox', number:'Number' };

const HEADER_MAP = {
  question:'question', answer:'answer',
  difficulty:'difficulty', difficulty13:'difficulty', diff:'difficulty',
  imgurl:'imgUrl', imageurl:'imgUrl', img:'imgUrl', image:'imgUrl',
  soundurl:'soundUrl', audiourl:'soundUrl', sound:'soundUrl', audio:'soundUrl',
  optiona:'optionA', optionb:'optionB', optionc:'optionC', optiond:'optionD',
  bonusquestion:'bonusQuestion', bonus:'bonusQuestion',
  tags:'tags', tag:'tags', notes:'notes', note:'notes',
  whisperduringquestion:'whisperQ', whisperquestion:'whisperQ', whisperq:'whisperQ', whisper1:'whisperQ', whisperduring:'whisperQ',

const norm = s => String(s ?? '').toLowerCase().replace(/[^a-z0-9]/g, '');
const normName = s => String(s ?? '').toLowerCase().replace(/[\u2018\u2019`´]/g, "'").replace(/\s+/g, ' ').trim();
const normQ = s => {
  const t = String(s ?? '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
  return t || String(s ?? '').trim().toLowerCase();
};

const GENERIC_TAB = /^(sheet|tab|page|worksheet)\s*\d*$/i;
const isGenericName = s => GENERIC_TAB.test(String(s ?? '').trim());
// Google names downloads "Workbook name - Tab name.csv". Each of your categories is its own
// workbook with one generic tab ("Sheet1"), so the category is the workbook name, not the tab.
function nameFromFile(fn){
  let n = String(fn).replace(/\.csv$/i, '').replace(/\s\(\d+\)$/, '').trim();
  const i = n.lastIndexOf(' - ');
  if (i >= 0){
    const book = n.slice(0, i).trim(), tab = n.slice(i + 3).trim();
    n = (GENERIC_TAB.test(tab) && book) ? book : tab;
  }
  return n.trim();
}

function parseCSV(text){
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQ){
      if (c === '"'){ if (text[i+1] === '"'){ field += '"'; i++; } else inQ = false; }
      else field += c;
    } else {
      if (c === '"' && field === '') inQ = true;
      else if (c === ','){ row.push(field); field = ''; }
      else if (c === '\n' || c === '\r'){
        if (c === '\r' && text[i+1] === '\n') i++;
        row.push(field); field = ''; rows.push(row); row = [];
      } else field += c;
    }
  }
  if (field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function parseTags(s){
  return [...new Set(String(s ?? '').split(/[,;\n]+/).map(t => t.trim().replace(/^#/, '').toLowerCase().replace(/\s+/g, ' ')).filter(Boolean))];
}
function keyFromLabel(label, taken){
  const words = String(label).replace(/[^A-Za-z0-9 ]+/g, ' ').trim().split(/\s+/).filter(Boolean);
  let k = words.map((w,i) => i ? w[0].toUpperCase() + w.slice(1).toLowerCase() : w.toLowerCase()).join('') || 'field';
  if (/^[0-9]/.test(k)) k = 'f' + k;
  const base = k; let n = 2;
  while (taken.has(k) || RESERVED.has(k)) k = base + n++;
  return k;
}
function guessType(label){
  if (/note|comment|feedback/i.test(label)) return 'long';
  if (/thumb|vote|rating|like/i.test(label)) return 'thumbs';
  return 'text';
}
function defaultFor(c){
  return c.type === 'diff' || c.type === 'number' ? null : c.type === 'check' ? false : c.type === 'tags' ? [] : '';
}
function convert(c, raw){
  const v = String(raw ?? '').trim();
  switch (c.type){
    case 'diff':   { const n = parseInt(v, 10); return n >= 1 && n <= 3 ? n : null; }
    case 'number': { const n = Number(v); return v !== '' && isFinite(n) ? n : null; }
    case 'check':  return /^(true|yes|y|1|x|✓|✔)$/i.test(v);
    case 'thumbs': return /up|👍|^\+|^yes|^true/i.test(v) ? 'up' : /down|👎|^-|^no/i.test(v) ? 'down' : '';
    case 'tags':   return parseTags(v);
    default:       return v;
  }
}

// Music sheets have no "Question" column: Song Title / Artist / Audio URL / Start / End / Album Art.
// For those, song -> Question, artist -> Answer, audio -> SOUND URL, album art -> IMG URL, and start/end
// times become custom columns (Start Time / End Time) that the trivia app reads for music rounds.
const MUSIC_MAP = {
  song:'question', songtitle:'question', songname:'question', title:'question', track:'question', trackname:'question', tracktitle:'question',
  artist:'answer', artists:'answer', performer:'answer', band:'answer', singer:'answer', artistname:'answer',
  audio:'soundUrl', audiourl:'soundUrl', url:'soundUrl', link:'soundUrl', songurl:'soundUrl', mp3:'soundUrl', preview:'soundUrl', previewurl:'soundUrl', file:'soundUrl', fileurl:'soundUrl',
  albumart:'imgUrl', albumarturl:'imgUrl', art:'imgUrl', cover:'imgUrl', albumcover:'imgUrl', coverart:'imgUrl', artwork:'imgUrl', albumimage:'imgUrl',
  start:{ key:'startTime', label:'Start Time' }, starttime:{ key:'startTime', label:'Start Time' }, startat:{ key:'startTime', label:'Start Time' }, clipstart:{ key:'startTime', label:'Start Time' },
  end:{ key:'endTime', label:'End Time' }, endtime:{ key:'endTime', label:'End Time' }, endat:{ key:'endTime', label:'End Time' }, clipend:{ key:'endTime', label:'End Time' }
};
const MUSIC_POSITIONAL = ['question', 'answer', 'soundUrl', { key:'startTime', label:'Start Time' }, { key:'endTime', label:'End Time' }, 'imgUrl'];

function customColFor(def, ctx){
  return ctx.custom.find(c => c.key === def.key) || ctx.pending.get(norm(def.label)) ||
    (() => { const col = { key:def.key, label:def.label, type:'text', isNew:true }; ctx.pending.set(norm(def.label), col); return col; })();
}
function colFromSpec(spec, ctx){ return typeof spec === 'string' ? BUILTIN.find(c => c.key === spec) : customColFor(spec, ctx); }

// ctx = { custom: [existing custom cols], pending: Map(normLabel -> new col) }
function mapHeaders(headerRow, ctx, extraMap){
  const map = [], seen = new Set();
  headerRow.forEach((h, i) => {
    const n = norm(h);
    if (!n){ map[i] = null; return; }
    let col = null;
    const bk = HEADER_MAP[n];
    if (bk) col = BUILTIN.find(c => c.key === bk);
    else if (extraMap && extraMap[n]) col = colFromSpec(extraMap[n], ctx);
    else {
      col = ctx.custom.find(c => norm(c.label) === n) || ctx.pending.get(n);
      if (!col){
        const taken = new Set([...BUILTIN.map(c => c.key), ...ctx.custom.map(c => c.key), ...[...ctx.pending.values()].map(c => c.key)]);
        col = { key: keyFromLabel(h, taken), label: String(h).trim(), type: guessType(h), isNew: true };
        ctx.pending.set(n, col);
      }
    }
    if (seen.has(col.key)){ map[i] = null; return; }
    seen.add(col.key); map[i] = col;
  });
  return map;
}

function recordsFromCSV(rows, ctx){
  const out = { records: [], blank: 0, noQ: 0, newCols: [], error: '' };
  if (!rows.length){ out.error = 'Empty file'; return out; }
  let map = mapHeaders(rows[0], ctx);
  if (!map.some(c => c && c.key === 'question')){
    // Not a regular question sheet — treat it as a music sheet.
    map = mapHeaders(rows[0], ctx, MUSIC_MAP);
    out.layout = 'music';
    const hasQ = map.some(c => c && c.key === 'question'), hasA = map.some(c => c && c.key === 'answer');
    if (!hasQ || !hasA){
      // Headers weren't recognizable: use the music sheet's fixed order (A song, B artist, C audio, D start, E end, F album art).
      map = rows[0].map((_, i) => MUSIC_POSITIONAL[i] ? colFromSpec(MUSIC_POSITIONAL[i], ctx) : null);
      out.layout = 'music (by column order)';
    }
  }
  out.newCols = [...new Set(map.filter(c => c && c.isNew))];
  for (let r = 1; r < rows.length; r++){
    const row = rows[r];
    if (row.every(x => !String(x).trim())){ out.blank++; continue; }
    const rec = {};
    for (const c of BUILTIN) rec[c.key] = defaultFor(c);
    for (const c of ctx.custom) rec[c.key] = defaultFor(c);
    map.forEach((c, i) => { if (c) rec[c.key] = convert(c, row[i]); });
    if (!rec.question){ out.noQ++; continue; }
    out.records.push(rec);
  }
  return out;
}

function csvEscape(v){
  if (v === null || v === undefined) return '';
  if (Array.isArray(v)) v = v.join(', ');
  const s = typeof v === 'boolean' ? (v ? 'TRUE' : '') : String(v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCSV(cols, items){
  const lines = [cols.map(c => csvEscape(c.exportLabel || c.label)).join(',')];
  for (const it of items) lines.push(cols.map(c => csvEscape(it[c.key])).join(','));
  return '\uFEFF' + lines.join('\r\n');
}

    let done = false; const finish = v => { if (done) return; done = true; res(v); };
    const body = document.createElement('div');
    body.innerHTML = `<label class="fld">${esc(label)}<input type="text" id="askIn" value="${esc(value)}" autocomplete="off"></label>`;
    const submit = () => { const v = $('#askIn').value.trim(); if (!v) return; finish(v); closeModal(); };
    openModal({ title, body, actions: [{ label: 'Cancel', onClick: () => { finish(null); closeModal(); } }, { label: ok, primary: true, onClick: submit }], onClose: () => finish(null) });
    const inp = $('#askIn'); inp.focus(); inp.select(); inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  });
}
function confirmBox({ title, message, ok = 'Confirm', danger }){
  return new Promise(res => {
    let done = false; const finish = v => { if (done) return; done = true; res(v); };
    openModal({ title, body: `<p class="hint" style="margin:0">${esc(message)}</p>`,
      actions: [{ label: 'Cancel', onClick: () => { finish(false); closeModal(); } }, { label: ok, primary: !danger, danger, onClick: () => { finish(true); closeModal(); } }], onClose: () => finish(false) });
  });
}

   5. LISTENERS: categories + custom columns
   ═══════════════════════════════════════════════════════════ */
function startListeners(){
  if (S.listening) { renderSide(); return; }
  S.listening = true;
  startFeedback();
  S.unsubs.push(onSnapshot(collection(db, 'triviaCategories'), snap => {
    S.cats = new Map(snap.docs.map(d => [d.id, { id: d.id, ...d.data() }]));
    if (!S.pending) setSync('synced', 'connected');
    renderSide(); renderHead();
    if (!S.curId){ const last = LS.get('lastCat', null); if (last && S.cats.has(last)) selectCategory(last); }
  }, err => {
    $('#catList').innerHTML = `<p class="hint" style="padding:12px">Can't read categories yet.<br>${/permission/i.test(err.message) ? 'Publish the updated Firestore rules, then refresh.' : esc(err.message)}</p>`;
  }));
  S.unsubs.push(onSnapshot(doc(db, 'triviaConfig', 'types'), snap => {
    S.types = snap.exists() ? (snap.data().list || []) : null;
    renderSide(); renderHead();
  }, () => {}));
  S.unsubs.push(onSnapshot(doc(db, 'triviaConfig', 'columns'), snap => {
    S.custom = snap.exists() ? (snap.data().custom || []) : [];
    S.order = snap.exists() ? (snap.data().order || null) : null;
    if (S.curId) renderAll();
  }, () => {}));
}

const baseCols = () => [...BUILTIN, ...S.custom.filter(c => !BUILTIN.some(b => b.key === c.key)).map(c => ({ ...c, w: c.w || CUSTOM_W[c.type] || 170 }))];
// Column order: Question is always first (pinned). Then the permanent order saved in Firestore (shared by all
// devices), or a temporary drag-and-drop order for this session if one is active. Columns not in the saved
// order (newly added ones) follow in their default position.
function orderCols(ord){
  const base = baseCols();
  if (!ord || !ord.length) return base;
  const by = new Map(base.map(c => [c.key, c])), out = [];
  const q = by.get('question'); if (q){ out.push(q); by.delete('question'); }
  for (const k of ord){ if (by.has(k)){ out.push(by.get(k)); by.delete(k); } }
  for (const c of base) if (by.has(c.key)) out.push(c);
  return out;
}
const allCols = () => orderCols(S.tempOrder || S.order);
const visibleCols = () => allCols().filter(c => c.key === 'question' || !S.hidden.has(c.key));

// Category types: the saved list (triviaConfig/types) in its saved order, then
// any type still in use by a category but missing from the list. Until a list
// has been saved, the defaults stand in.
function typeList(){
  const base = S.types && S.types.length ? S.types : DEFAULT_TYPES;
  const seen = new Set(base.map(normName)), out = [...base], extra = [];
  for (const c of S.cats.values()) if (c.type && !seen.has(normName(c.type))){ seen.add(normName(c.type)); extra.push(c.type); }
  return [...out, ...extra.sort((a, b) => a.localeCompare(b))];
}
async function saveTypes(list){ await setDoc(doc(db, 'triviaConfig', 'types'), { list, updatedAt: serverTimestamp() }); }
async function addType(name){
  name = String(name || '').trim(); if (!name) return null;
  const hit = typeList().find(t => normName(t) === normName(name)); if (hit) return hit;
  await saveTypes([...typeList(), name]); return name;
}
function catByNorm(name){ const k = normName(name); for (const c of S.cats.values()) if (normName(c.name) === k) return c; return null; }

function renderSide(){
  const q = $('#catSearch').value.trim().toLowerCase(), showArch = $('#showArchCats').checked;

    const closed = !q && S.collapsed.has(t);
    html += `<div class="grp ${closed ? 'closed' : ''}"><button class="grpHead" data-type="${esc(t)}"><span class="chev">▾</span>${esc(t)}<em>${list.length}</em></button><div class="grpBody">` +
      list.map(c => `<button class="cat ${c.id === S.curId ? 'active' : ''} ${c.archived ? 'arch' : ''}" data-id="${c.id}"><span class="nm">${esc(c.name)}</span><span class="ct">${c.questionCount ?? ''}</span></button>`).join('') +

function updateCount(){
  const c = S.cats.get(S.curId); if (!c) return;
  let shown = 0, total = 0, dups = 0;
  for (const r of S.rows.values()){ if (!r.persisted || r.data.archived) continue; total++; if (r.tr && !r.tr.hidden) shown++; if (r.tr && r.tr.classList.contains('dup')) dups++; }
  const filtered = shown !== total;
  $('#catCount').textContent = `${filtered ? shown + ' of ' : ''}${total} question${total === 1 ? '' : 's'}`;
  if (dups) $('#catCount').textContent += ` · ${dups} possible duplicate${dups === 1 ? '' : 's'} (marked red)`;
}

/* ═══════════════════════════════════════════════════════════
   7. CATEGORY SELECT + QUESTION GRID
   ═══════════════════════════════════════════════════════════ */
const tbody = $('#grid tbody'), thead = $('#grid thead');

/* Live subscriptions are kept warm per category, so switching back to one you've
   already opened is instant, and hovering a category starts loading it early. */
const SUBS = new Map(); // id -> { id, rows, maxOrder, loaded, unsub }
const MAX_SUBS = 10;
function dropSub(id){ const st = SUBS.get(id); if (st){ if (st.unsub) st.unsub(); SUBS.delete(id); } }
function dropAllSubs(){ for (const st of SUBS.values()) if (st.unsub) st.unsub(); SUBS.clear(); }
function maxOrderOf(rows){ let m = 0; for (const r of rows.values()) if (r.persisted) m = Math.max(m, Number(r.data.order) || 0); return m; }
function setLoading(on){ $('#loading').classList.toggle('hidden', !on); }

function ensureSub(id){
  let st = SUBS.get(id);
  if (st){ SUBS.delete(id); SUBS.set(id, st); return st; }
  st = { id, rows: new Map(), maxOrder: 0, loaded: false, unsub: null };
  SUBS.set(id, st);
  st.unsub = onSnapshot(query(qColl(), where('categoryId', '==', id)), snap => {
    const cur = S.curId === id, changes = snap.docChanges();
    // a cache-only "empty" answer isn't trustworthy yet; wait for the server before calling it empty
    if (!st.loaded && snap.metadata.fromCache && snap.empty && navigator.onLine) return;
    if (!st.loaded || changes.length > 40 || !cur){
      changes.forEach(ch => {
        if (ch.type === 'removed'){ st.rows.delete(ch.doc.id); return; }
        const old = st.rows.get(ch.doc.id);
        st.rows.set(ch.doc.id, { id: ch.doc.id, ref: ch.doc.ref, data: ch.doc.data(), persisted: true, tr: null, ready: old ? old.ready : undefined });
      });
      st.maxOrder = Math.max(st.maxOrder, maxOrderOf(st.rows)); st.loaded = true;
      if (cur){ S.maxOrder = Math.max(S.maxOrder, st.maxOrder); setLoading(false); renderAll(); }
      return;
    }
    changes.forEach(applyChange);
    st.maxOrder = Math.max(st.maxOrder, maxOrderOf(st.rows)); S.maxOrder = Math.max(S.maxOrder, st.maxOrder);
    applyFilter(); scheduleDupes(); updateCount();
  }, err => {
    if (S.curId === id){ setLoading(false); toast(/permission/i.test(err.message) ? 'Can’t read questions — publish the updated Firestore rules.' : err.message); }
    dropSub(id);
  });
  while (SUBS.size > MAX_SUBS){ const k = [...SUBS.keys()].find(x => x !== S.curId); if (!k) break; dropSub(k); }
  return st;
}

function selectCategory(id){
  if (!S.cats.has(id)) return;
  const prev = SUBS.get(S.curId); if (prev) prev.maxOrder = Math.max(prev.maxOrder, S.maxOrder);
  S.curId = id; LS.set('lastCat', id);
  const st = ensureSub(id);
  S.rows = st.rows; S.maxOrder = st.maxOrder;
  S.filter = { q: '', diff: 0, tags: new Set() }; $('#q').value = ''; $$('#diffChips button').forEach(b => b.classList.toggle('on', b.dataset.d === '0'));
  showEditor(true); renderSide(); renderHead(); renderAll();
  setLoading(!st.loaded);
}
let hoverT;
$('#catList').addEventListener('mouseover', e => {
  const c = e.target.closest('.cat'); if (!c) return;
  clearTimeout(hoverT); hoverT = setTimeout(() => { if (S.cats.has(c.dataset.id)) ensureSub(c.dataset.id); }, 180);
});

function applyChange(ch){
  const id = ch.doc.id, data = ch.doc.data();
  if (ch.type === 'removed'){ const r = S.rows.get(id); if (r?.tr) r.tr.remove(); S.rows.delete(id); return; }
  let r = S.rows.get(id);
  if (!r){
    r = { id, ref: ch.doc.ref, data, persisted: true, tr: null };
    S.rows.set(id, r); r.tr = buildRow(r); insertSorted(r); autosizeRow(r.tr);
  } else {
    r.persisted = true; r.ref = ch.doc.ref; r.data = { ...data };
    if (r.tr){ r.tr.classList.remove('draft'); updateRowDom(r); }
  }
}

function cmpRows(a, b){
  const k = S.sort.key, sv = v => (v === null || v === undefined || v === '') ? null : v;
  const x = sv(a.data[k]), y = sv(b.data[k]);
  if (x === null && y !== null) return 1;
  if (y === null && x !== null) return -1;
  let c = 0;
  if (x !== null && y !== null) c = (typeof x === 'number' && typeof y === 'number') ? x - y : String(x).localeCompare(String(y), undefined, { numeric: true, sensitivity: 'base' });
  if (c !== 0) return c * S.sort.dir;
  return (Number(a.data.order) || 0) - (Number(b.data.order) || 0);
}
function insertSorted(r){
  const firstDraft = tbody.querySelector('tr.draft');
  for (const tr of tbody.children){
    if (tr.classList.contains('draft')) break;
    const other = S.rows.get(tr.dataset.id);
    if (other && cmpRows(r, other) < 0){ tbody.insertBefore(r.tr, tr); return; }
  }
  if (firstDraft) tbody.insertBefore(r.tr, firstDraft); else tbody.appendChild(r.tr);
}

function renderAll(){
  const cols = visibleCols();
  thead.innerHTML = '<tr><th class="num">#</th><th class="fb" title="Host feedback from live games: ★ = notes to review, then 👍 / 👎 counts">Feedback</th>' + cols.map(c =>
    `<th data-key="${c.key}" ${c.key === 'question' ? '' : 'draggable="true"'} title="${c.key === 'question' ? 'Click to sort' : 'Click to sort · drag to move this column for now'}" class="${c.key === 'question' ? 'stickyQ' : ''}" style="min-width:${c.w}px;width:${c.w}px">${esc(c.label)} <span class="sortInd">${S.sort.key === c.key ? (S.sort.dir === 1 ? '▲' : '▼') : ''}</span></th>`).join('') + '<th class="act"></th></tr>';
  tbody.innerHTML = '';
  const persisted = [...S.rows.values()].filter(r => r.persisted).sort(cmpRows);
  const drafts = [...S.rows.values()].filter(r => !r.persisted);
  const frag = document.createDocumentFragment();
  [...persisted, ...drafts].forEach(r => { r.tr = buildRow(r); frag.appendChild(r.tr); });
  tbody.appendChild(frag);
  $('#resetOrderBtn').classList.toggle('hidden', !S.tempOrder);
  document.body.classList.toggle('showArch', $('#showArch').checked);
  applyFilter(); refreshDupes(); updateCount(); renderTagBar();
  requestAnimationFrame(() => autosizeAll($$('textarea', tbody)));
}
/* ── Drag a column header to move it for this session only (Columns ▸ Move columns to make it permanent) ── */
let dragKey = null;
const clearDrop = () => $$('#grid th.dropL,#grid th.dropR,#grid th.dragging').forEach(t => t.classList.remove('dropL', 'dropR', 'dragging'));
thead.addEventListener('dragstart', e => {
  const th = e.target.closest('th[data-key]'); if (!th || th.dataset.key === 'question') { e.preventDefault(); return; }
  dragKey = th.dataset.key; th.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragKey); } catch (_) {}
});
thead.addEventListener('dragover', e => {
  if (!dragKey) return; const th = e.target.closest('th[data-key]'); if (!th || th.dataset.key === dragKey) return;
  e.preventDefault(); $$('#grid th.dropL,#grid th.dropR').forEach(t => t.classList.remove('dropL', 'dropR'));
  const r = th.getBoundingClientRect(); th.classList.add(e.clientX < r.left + r.width / 2 ? 'dropL' : 'dropR');
});
thead.addEventListener('drop', e => {
  if (!dragKey) return; const th = e.target.closest('th[data-key]'); if (!th) return; e.preventDefault();
  const r = th.getBoundingClientRect(), after = e.clientX >= r.left + r.width / 2, target = th.dataset.key;
  const keys = allCols().map(c => c.key).filter(k => k !== 'question' && k !== dragKey);
  if (target === 'question') keys.unshift(dragKey); else { const i = keys.indexOf(target); keys.splice(i + (after ? 1 : 0), 0, dragKey); }
  dragKey = null; clearDrop(); S.tempOrder = keys; renderAll();
});
thead.addEventListener('dragend', () => { dragKey = null; clearDrop(); });
$('#resetOrderBtn').addEventListener('click', () => { S.tempOrder = null; renderAll(); });
thead.addEventListener('click', e => {
  const th = e.target.closest('th[data-key]'); if (!th) return;
  const k = th.dataset.key;
  S.sort = S.sort.key === k ? { key: k, dir: -S.sort.dir } : { key: k, dir: 1 };
  renderAll();
});

function cellHTML(c, v){
  const key = `data-key="${c.key}"`;
  switch (c.type){
    case 'long':   return `<textarea rows="1" ${key} spellcheck="true">${esc(v)}</textarea>`;
    case 'diff':   return `<select ${key} class="d${v || 0}"><option value=""></option>${[1,2,3].map(n => `<option value="${n}" ${Number(v) === n ? 'selected' : ''}>${n}</option>`).join('')}</select>`;
    case 'thumbs': return `<button type="button" class="thumb" ${key} data-v="${esc(v || '')}">${v === 'up' ? '👍' : v === 'down' ? '👎' : '·'}</button>`;
    case 'tags':   return `<input type="text" ${key} value="${esc((v || []).join(', '))}" autocomplete="off" placeholder="tag, tag…">`;
    case 'check':  return `<input type="checkbox" ${key} ${v ? 'checked' : ''}>`;
    default:       return `<input type="text" ${key} value="${esc(v)}" autocomplete="off">`;
  }
}
/* ═══════════════════════════════════════════════════════════
   FEEDBACK — host 👍 / 👎 and notes from live games. Stored by the trivia app in the realtime database at
   trivia/questionFeedback/<key>; for Vault questions the key is vault__<categoryId>__<questionId>.
   ═══════════════════════════════════════════════════════════ */
let rtdb = null, fbRedraw = null, fbWarned = false;
const fbKeyOf = r => 'vault__' + ((r.data && r.data.categoryId) || S.curId) + '__' + r.id;
const fbNotes = rec => Object.entries((rec && rec.notes) || {}).map(([id, n]) => ({ id, ...n })).sort((a, b) => (b.ts || 0) - (a.ts || 0));
function fbHTML(r){
  const rec = S.fb.get(fbKeyOf(r)); if (!rec) return '';
  const n = fbNotes(rec).length, up = rec.thumbsUp || 0, dn = rec.thumbsDown || 0;
  return (n ? `<button class="star" data-fbnotes title="${n} note${n > 1 ? 's' : ''} to review — click to read">★</button>` : '') +
         (up || dn ? `<span class="fbup" title="Thumbs up">👍 ${up}</span><span class="fbdn ${dn ? 'has' : ''}" title="Thumbs down">👎 ${dn}</span>` : '');
}
function fbRefreshRow(key){
  const m = /^vault__(.+?)__(.+)$/.exec(key); if (!m) return;
  const st = SUBS.get(m[1]), r = st && st.rows.get(m[2]); if (!r || !r.tr) return;
  const td = r.tr.querySelector('td.fb'); if (td) td.innerHTML = fbHTML(r);
}
function fbUpdateBadge(){
  const n = [...S.fb.values()].filter(rec => fbNotes(rec).length).length;
  const b = $('#notesBadge'); if (b){ b.textContent = n; b.classList.toggle('zero', !n); }
}
function fbSet(key, val){ S.fb.set(key, val); fbRefreshRow(key); fbUpdateBadge(); if (fbRedraw) fbRedraw(); }
function fbDel(key){ S.fb.delete(key); fbRefreshRow(key); fbUpdateBadge(); if (fbRedraw) fbRedraw(); }
function startFeedback(){
  S.fb.clear();
  try {
    rtdb = rtdb || getDatabase(app);
    const f = rref(rtdb, 'trivia/questionFeedback');
    const err = e => { if (!fbWarned){ fbWarned = true; toast('Can’t read host feedback: ' + (e && e.message || e)); } };
    S.unsubs.push(onChildAdded(f, s => fbSet(s.key, s.val()), err));
    S.unsubs.push(onChildChanged(f, s => fbSet(s.key, s.val()), err));
    S.unsubs.push(onChildRemoved(f, s => fbDel(s.key), err));
  } catch (e){ console.warn('Feedback unavailable', e); }
}
// A category made here also gets its Trivia-app / Planner category and Venue Menu entry,
// linked by ID (vaultCatId / vmCatId / triviaCatId). Skipped quietly if one already exists by name
// or if this account can't write there.
async function mirrorNewVaultCategory(vaultId, name, type){
  try {
    rtdb = rtdb || getDatabase(app);
    const snap = await rget(rref(rtdb, 'trivia/categories'));
    const all = snap.val() || {};
    const want = normName(name);
    const hit = Object.entries(all).find(([id, c]) => normName(c && c.name) === want);
    if (hit){ if (!hit[1].vaultCatId) await rupdate(rref(rtdb, 'trivia/categories/' + hit[0]), { vaultCatId: vaultId }); return; }
    const r = rpush(rref(rtdb, 'trivia/categories'));
    const isMusic = /music/i.test(type || '');
    await rset(r, { name, genre: '', type: isMusic ? 'music' : 'trivia', vaultCatId: vaultId, unified: true, notes: 'Created from the Question Vault', createdAt: Date.now(), updatedAt: Date.now() });
    const vm = await addDoc(collection(db, 'venueMenuCategories'), { name, type: 'Trivia', tags: '', image: '', plannerTier: null, linked: true, triviaCatId: r.key, createdAt: Date.now(), updatedAt: Date.now() });
    await rupdate(rref(rtdb, 'trivia/categories/' + r.key), { vmCatId: vm.id });
  } catch (e){ console.warn('Could not mirror the new category into Trivia / Venue Menu:', e && e.message); }
}
const fbPath = (key, sub) => rref(rtdb, 'trivia/questionFeedback/' + key + (sub ? '/' + sub : ''));

function jumpToQuestion(catId, qid){
  closeModal(); if (S.cats.has(catId)) selectCategory(catId);
  let tries = 0; const t = setInterval(() => {
    const r = S.rows.get(qid); tries++;
    if (r && r.tr){ clearInterval(t); r.tr.scrollIntoView({ block: 'center' }); r.tr.classList.add('flash'); setTimeout(() => r.tr.classList.remove('flash'), 2600); }
    else if (tries > 30) clearInterval(t);
  }, 150);
}

function openNotesReview(onlyKey){
  const body = document.createElement('div');
  const when = ts => ts ? new Date(ts).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : '';
  const draw = () => {
    let items = [...S.fb.entries()].map(([key, rec]) => ({ key, rec, notes: fbNotes(rec) })).filter(x => x.notes.length && (!onlyKey || x.key === onlyKey));
    if (!items.length){ body.innerHTML = `<p class="hint" style="margin:0">${onlyKey ? 'No notes on this question.' : 'Nothing to review — no host notes waiting. 🎉'}</p>`; return; }
    const groups = new Map();
    for (const x of items){
      const m = /^vault__(.+?)__(.+)$/.exec(x.key);
      x.catId = m ? m[1] : null; x.qid = m ? m[2] : null;
      const label = m ? (S.cats.get(m[1])?.name || 'Deleted category') : ('Old sheet' + (x.rec.tabName ? ' · ' + x.rec.tabName : ''));
      if (!groups.has(label)) groups.set(label, []); groups.get(label).push(x);
    }
    body.innerHTML = [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([label, list]) =>
      `<div class="nrCat">${esc(label)}</div>` + list.map(x => `<div class="nrCard" data-key="${esc(x.key)}">
        <div class="nrQ">${esc(x.rec.question || '(question text unavailable)')}</div>
        <div class="nrA">Answer: ${esc(x.rec.answer || '—')}</div>
        <div class="nrMeta"><span>👍 ${x.rec.thumbsUp || 0}</span><span>👎 ${x.rec.thumbsDown || 0}</span>
          ${x.catId ? `<button class="linkbtn" data-go="${esc(x.catId)}:${esc(x.qid)}">Go to question</button>` : ''}
          <button class="linkbtn" data-clearnotes="${esc(x.key)}">Done — clear all notes</button></div>
        ${x.notes.map(n => `<div class="nrNote"><div>${esc(n.text)}<small>${n.byName ? esc(n.byName) + ' · ' : ''}${when(n.ts)}</small></div><button class="btn ghost sm" data-delnote="${esc(x.key)}:${esc(n.id)}">Delete</button></div>`).join('')}
      </div>`).join('')).join('');
  };
  draw(); fbRedraw = draw;
  body.addEventListener('click', async e => {
    const g = e.target.closest('[data-go]'); if (g){ const [c, q] = g.dataset.go.split(':'); jumpToQuestion(c, q); return; }
    const dn = e.target.closest('[data-delnote]'); if (dn){ const i = dn.dataset.delnote.lastIndexOf(':'); const key = dn.dataset.delnote.slice(0, i), id = dn.dataset.delnote.slice(i + 1); await run(() => rremove(fbPath(key, 'notes/' + id))); return; }
    const cn = e.target.closest('[data-clearnotes]'); if (cn){ await run(() => rremove(fbPath(cn.dataset.clearnotes, 'notes'))); }
  });
  openModal({ title: onlyKey ? 'Notes on this question' : 'Host notes to review', body, wide: !onlyKey, actions: [{ label: 'Close', primary: true, onClick: closeModal }], onClose: () => { fbRedraw = null; } });
}

function buildRow(r){
  const tr = document.createElement('tr'); tr.dataset.id = r.id;
  if (!r.persisted) tr.classList.add('draft');
  if (r.data.archived) tr.classList.add('arch');
  let h = '<td class="num"><span class="dot"></span><span class="n"></span></td><td class="fb">' + fbHTML(r) + '</td>';
  for (const c of visibleCols()) h += `<td class="c-${c.type}${c.key === 'question' ? ' stickyQ' : ''}">${cellHTML(c, r.data[c.key])}</td>`;
  h += r.data.archived
    ? '<td class="act"><button class="ico" data-act="restore" tabindex="-1" title="Restore">↺</button><button class="ico del" data-act="delete" tabindex="-1" title="Delete forever">🗑</button></td>'
    : '<td class="act"><button class="ico" data-act="archive" tabindex="-1" title="Archive this question">✕</button></td>';
  tr.innerHTML = h; return tr;
}
function updateRowDom(r){
  const tr = r.tr; const act = document.activeElement;
  tr.classList.toggle('arch', !!r.data.archived);
  const cell = tr.querySelector('td.act'); const wantArch = !!r.data.archived;
  if (cell && (cell.querySelector('[data-act=restore]') ? !wantArch : wantArch)){
    cell.innerHTML = wantArch ? '<button class="ico" data-act="restore" tabindex="-1" title="Restore">↺</button><button class="ico del" data-act="delete" tabindex="-1" title="Delete forever">🗑</button>' : '<button class="ico" data-act="archive" tabindex="-1" title="Archive this question">✕</button>';
  }
  for (const c of visibleCols()){
    const el = tr.querySelector(`[data-key="${c.key}"]`); if (!el || el === act) continue;
    const v = r.data[c.key];
    if (c.type === 'tags') el.value = (v || []).join(', ');
    else if (c.type === 'check') el.checked = !!v;
    else if (c.type === 'thumbs'){ el.dataset.v = v || ''; el.textContent = v === 'up' ? '👍' : v === 'down' ? '👎' : '·'; }
    else if (c.type === 'diff'){ el.value = v ?? ''; el.className = 'd' + (v || 0); }
    else { const nv = v ?? ''; if (el.value !== String(nv)){ el.value = nv; if (el.tagName === 'TEXTAREA') autosize(el); } }
  }
}
// Collapsing a textarea to height:auto briefly shrinks the whole sheet, which
// made the browser jump the scroll position. Remember it and put it back.
function keepScroll(fn){ const w = document.querySelector('.gridWrap'); const t = w ? w.scrollTop : 0, l = w ? w.scrollLeft : 0; fn(); if (w){ if (w.scrollTop !== t) w.scrollTop = t; if (w.scrollLeft !== l) w.scrollLeft = l; } }
function autosizeAll(els){ keepScroll(() => { els.forEach(e => { e.style.height = 'auto'; }); const hs = els.map(e => Math.max(e.scrollHeight, 34)); els.forEach((e, i) => { e.style.height = hs[i] + 'px'; }); }); }
function autosize(el){ keepScroll(() => { el.style.height = 'auto'; el.style.height = Math.max(el.scrollHeight, 34) + 'px'; }); }
function autosizeRow(tr){ requestAnimationFrame(() => $$('textarea', tr).forEach(autosize)); }

/* editing ---------------------------------------------------- */
function readEl(el, col){
  if (col.type === 'check') return el.checked;
  if (col.type === 'thumbs') return el.dataset.v || '';
  return convert(col, el.value);
}
function colOf(el){ return allCols().find(c => c.key === el.dataset.key); }
function rowOf(el){ return S.rows.get(el.closest('tr')?.dataset.id); }
function setDot(r, cls){ if (!r?.tr) return; r.tr.classList.remove('saving', 'saved', 'error'); if (cls) r.tr.classList.add(cls); if (cls === 'saved') setTimeout(() => r.tr && r.tr.classList.remove('saved'), 1600); }
function setSync(cls, txt){ const d = $('#syncDot'), l = $('#syncLabel'); if (d) d.className = 'sync-dot ' + cls; if (l) l.textContent = txt; }
function pend(n){ S.pending += n; if (!navigator.onLine) return; S.pending > 0 ? setSync('syncing', 'saving…') : setSync('synced', 'all changes saved'); }

async function onEdit(el){
  const col = colOf(el), r = rowOf(el); if (!col || !r) return;
  const v = readEl(el, col);
  if (col.type === 'diff') el.className = 'd' + (v || 0);
  if (col.type === 'tags') el.value = v.join(', ');
  r.data[col.key] = v;
  await saveField(r, col.key, v);
}
async function saveField(r, key, v){
  setDot(r, 'saving'); pend(1);
  try {
    if (!r.persisted){
      r.persisted = true; r.tr.classList.remove('draft');
      const data = { ...r.data, categoryId: S.curId, archived: false, order: ++S.maxOrder, createdAt: serverTimestamp(), updatedAt: serverTimestamp() };
      const batch = writeBatch(db);
      batch.set(r.ref, data);
      batch.update(catRef(S.curId), { questionCount: increment(1), updatedAt: serverTimestamp() });
      r.ready = batch.commit();
      await r.ready;
    } else {
      if (r.ready) await r.ready;
      await updateDoc(r.ref, { [key]: v, updatedAt: serverTimestamp() });
    }
    setDot(r, 'saved');
  } catch (e){
    console.error(e); setDot(r, 'error');
    toast(/permission/i.test(e.message) ? 'Save blocked — publish the updated Firestore rules.' : 'Couldn\u2019t save that edit: ' + e.message);
  } finally { pend(-1); scheduleDupes(); }
}

tbody.addEventListener('focusin', e => { const el = e.target; if (el.matches('input[type=text],textarea')) el.dataset.orig = el.value; });
tbody.addEventListener('focusout', e => { const el = e.target; if (el.matches('input[type=text],textarea') && el.value !== el.dataset.orig) onEdit(el); });
tbody.addEventListener('change', e => { const el = e.target; if (el.matches('select,input[type=checkbox]')) onEdit(el); });
tbody.addEventListener('input', e => { if (e.target.matches('textarea')) autosize(e.target); });
tbody.addEventListener('keydown', e => {
  const el = e.target;
  if (!el.matches('input[type=text],textarea')) return;
  if (e.key === 'Escape'){ el.value = el.dataset.orig ?? el.value; el.blur(); return; }
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); moveDown(el); }
});
tbody.addEventListener('click', async e => {
  const st = e.target.closest('[data-fbnotes]'); if (st){ const rr = S.rows.get(st.closest('tr').dataset.id); if (rr) openNotesReview(fbKeyOf(rr)); return; }
  const th = e.target.closest('.thumb');
  if (th){ const r = rowOf(th); const cur = th.dataset.v; const nx = cur === '' ? 'up' : cur === 'up' ? 'down' : ''; th.dataset.v = nx; th.textContent = nx === 'up' ? '👍' : nx === 'down' ? '👎' : '·'; r.data[th.dataset.key] = nx; saveField(r, th.dataset.key, nx); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;

  if (b.dataset.act === 'archive') archiveRow(r, true);

    if (await confirmBox({ title: 'Delete forever?', message: 'This question will be permanently deleted. This can\u2019t be undone.', ok: 'Delete forever', danger: true })) run(async () => { await deleteDoc(r.ref); });
  }
});

function moveDown(el){
  const key = el.dataset.key; let tr = el.closest('tr').nextElementSibling;
  while (tr && tr.offsetParent === null) tr = tr.nextElementSibling;
  if (tr){ const t = tr.querySelector(`[data-key="${key}"]`); if (t){ t.focus(); if (t.select) t.select(); } return; }
  const last = S.rows.get(el.closest('tr').dataset.id);
  if (last && (last.persisted || String(last.data.question || '').trim() || el.value.trim())) addDraft(key);
}
function addDraft(focusKey = 'question'){
  const blank = [...S.rows.values()].find(r => !r.persisted && !String(r.data.question || '').trim());
  if (blank && blank.tr && blank.tr.isConnected){ focusRowTop(blank.tr, blank.tr.querySelector(`[data-key="${focusKey}"]`)); return; }
  if (blank) { S.rows.delete(blank.id); }
  const ref = doc(qColl());
  const data = {}; for (const c of allCols()) data[c.key] = defaultFor(c);
  if (S.filter.diff) data.difficulty = S.filter.diff;
  const r = { id: ref.id, ref, data, persisted: false, tr: null };
  S.rows.set(r.id, r); r.tr = buildRow(r); tbody.appendChild(r.tr); autosizeRow(r.tr);
  const t = r.tr.querySelector(`[data-key="${focusKey}"]`) || r.tr.querySelector('[data-key="question"]');
  focusRowTop(r.tr, t);
  // Re-assert once layout has settled so the very first press always lands.
  requestAnimationFrame(() => { if (r.tr.isConnected) focusRowTop(r.tr, t); });
}
// Bring a row to the top of the sheet (just under the header) and focus it, so
// the newest question sits where typing is comfortable.
function focusRowTop(tr, el){
  const w = document.querySelector('.gridWrap'); if (!w || !tr) return;
  const head = w.querySelector('thead')?.offsetHeight || 40;
  w.scrollTop = Math.max(0, tr.offsetTop - head - 4);
  if (el){ try { el.focus({ preventScroll: true }); } catch (_) { el.focus(); } }
}

async function archiveRow(r, val){
  if (!r.persisted){ r.tr.remove(); S.rows.delete(r.id); scheduleDupes(); updateCount(); return; }
  await run(async () => {
    const batch = writeBatch(db);
    batch.update(r.ref, { archived: val, updatedAt: serverTimestamp() });
    batch.update(catRef(S.curId), { questionCount: increment(val ? -1 : 1), updatedAt: serverTimestamp() });
    await batch.commit();
    if (val) toast('Question archived', { label: 'Undo', fn: () => archiveRow(r, false) });
  });
}

/* tag bar: click tags to filter this category (a question must have every selected tag) */
function renderTagBar(){
  const bar = $('#tagBar'); if (!bar) return;
  const counts = new Map();
  for (const r of S.rows.values()){ if (!r.persisted || r.data.archived) continue; for (const t of (r.data.tags || [])) counts.set(t, (counts.get(t) || 0) + 1); }
  const tags = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  if (!tags.length && !S.filter.tags.size){ bar.classList.add('hidden'); bar.innerHTML = ''; return; }
  bar.classList.remove('hidden');
  bar.innerHTML = '<span class="tagLbl">Tags</span>' +
    tags.slice(0, 80).map(([t, n]) => `<button class="pill ${S.filter.tags.has(t) ? 'on' : ''}" data-tag="${esc(t)}">${esc(t)} <small>${n}</small></button>`).join('') +
    (S.filter.tags.size ? '<button class="pill" data-clear="1">clear ✕</button>' : '');
}
$('#tagBar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.clear) S.filter.tags.clear();
  else if (b.dataset.tag) S.filter.tags.has(b.dataset.tag) ? S.filter.tags.delete(b.dataset.tag) : S.filter.tags.add(b.dataset.tag);
  applyFilter(); renderTagBar();
});

/* filters + dupes --------------------------------------------- */
function applyFilter(){
  const q = S.filter.q.toLowerCase(), d = S.filter.diff;
  for (const r of S.rows.values()){
    if (!r.tr) continue;
    let vis = true;
    if (r.persisted){
      if (d && Number(r.data.difficulty) !== d) vis = false;
      if (vis && S.filter.tags.size){ const have = r.data.tags || []; for (const t of S.filter.tags) if (!have.includes(t)) vis = false; }
      if (vis && q){ const hay = [r.data.question, r.data.answer, r.data.optionA, r.data.optionB, r.data.optionC, r.data.optionD, r.data.bonusQuestion, r.data.notes, (r.data.tags || []).join(' ')].join(' ').toLowerCase(); if (!hay.includes(q)) vis = false; }
    }
    r.tr.hidden = !vis;
  }
  updateCount();
  requestAnimationFrame(() => autosizeAll($$('tr:not([hidden]) textarea', tbody)));
}
let dupTimer; function scheduleDupes(){ clearTimeout(dupTimer); dupTimer = setTimeout(() => { refreshDupes(); updateCount(); renderTagBar(); }, 250); }
function refreshDupes(){
  const m = new Map();
  for (const r of S.rows.values()){ if (!r.persisted || r.data.archived) continue; const k = normQ(r.data.question); if (!k) continue; if (!m.has(k)) m.set(k, 0); m.set(k, m.get(k) + 1); }
  for (const r of S.rows.values()){
    if (!r.tr) continue;
    const isDup = r.persisted && !r.data.archived && (m.get(normQ(r.data.question)) || 0) > 1 && !!String(r.data.question || '').trim();
    r.tr.classList.toggle('dup', isDup); r.tr.firstElementChild.title = isDup ? 'Possible duplicate question' : '';
  }
}
$('#q').addEventListener('input', e => { S.filter.q = e.target.value.trim(); applyFilter(); });
$('#diffChips').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.filter.diff = Number(b.dataset.d); $$('#diffChips button').forEach(x => x.classList.toggle('on', x === b)); applyFilter(); });
$('#showArch').addEventListener('change', e => { document.body.classList.toggle('showArch', e.target.checked); applyFilter(); });

/* ── Manage category types: add, rename (updates every category using it), delete empty ones ── */
function openTypes(){
  const body = document.createElement('div');
  const draw = () => {
    const counts = new Map(); for (const c of S.cats.values()) if (c.type) counts.set(c.type, (counts.get(c.type) || 0) + 1);
    body.innerHTML = `<p class="hint" style="margin:0 0 10px">Types group your categories in the sidebar, in this order — drag ⠿ or use ▲▼ to rearrange. Renaming a type renames it on every category that uses it.</p>
      <div id="typeRows">${typeList().map((t, i) => `<div class="fld" style="display:flex;gap:8px;align-items:center;margin:6px 0">
        <span class="tgrab" draggable="true" data-drag="${i}" title="Drag to reorder" style="cursor:grab;color:var(--text3);user-select:none;padding:0 2px">⠿</span>
        <button class="btn ghost sm" data-up="${i}" ${i === 0 ? 'disabled' : ''} title="Move up">▲</button><button class="btn ghost sm" data-dn="${i}" ${i === typeList().length - 1 ? 'disabled' : ''} title="Move down">▼</button>
        <input type="text" value="${esc(t)}" data-i="${i}" data-old="${esc(t)}" style="flex:1" autocomplete="off">
        <span class="hint" style="min-width:70px;text-align:right">${counts.get(t) || 0} categor${(counts.get(t) || 0) === 1 ? 'y' : 'ies'}</span>
        <button class="btn ghost sm" data-del="${i}" ${(counts.get(t) || 0) ? 'disabled title="Move or delete its categories first"' : ''}>Delete</button></div>`).join('')}</div>
      <div class="fld" style="display:flex;gap:8px;margin-top:14px"><input type="text" id="newTypeIn" placeholder="New type name (for example: Holiday)" style="flex:1" autocomplete="off"><button class="btn primary sm" id="newTypeAdd">Add type</button></div>
      <div class="msg" id="typeMsg"></div>`;
  };
  draw();
  body.addEventListener('change', async e => {
    const el = e.target.closest('input[data-old]'); if (!el) return;
    const old = el.dataset.old, nu = el.value.trim();
    if (!nu || nu === old){ el.value = old; return; }
    if (typeList().some(t => t !== old && normName(t) === normName(nu))){ $('#typeMsg').textContent = 'That type already exists.'; el.value = old; return; }
    await run(async () => {
      const list = typeList().map(t => t === old ? nu : t); await saveTypes(list);
      const ids = [...S.cats.values()].filter(c => c.type === old).map(c => c.id);
      for (let i = 0; i < ids.length; i += 400){ const b = writeBatch(db); ids.slice(i, i + 400).forEach(id => b.update(catRef(id), { type: nu, updatedAt: serverTimestamp() })); await b.commit(); }
      toast(`Renamed to “${nu}”`);
    });
    setTimeout(draw, 300);
  });
  const add = async () => {
    const v = $('#newTypeIn').value.trim(); if (!v) return;
    if (typeList().some(t => normName(t) === normName(v))){ $('#typeMsg').textContent = 'That type already exists.'; return; }
    await run(() => addType(v)); setTimeout(draw, 300);
  };
  const moveType = async (from, to) => {
    const list = typeList(); if (to < 0 || to >= list.length || from === to) return;
    const [m] = list.splice(from, 1); list.splice(to, 0, m);
    await run(() => saveTypes(list)); setTimeout(draw, 250);
  };
  let dragI = null;
  body.addEventListener('dragstart', e => { const g = e.target.closest('[data-drag]'); if (!g) return; dragI = +g.dataset.drag; try { e.dataTransfer.setData('text/plain', String(dragI)); } catch (_) {} });
  body.addEventListener('dragover', e => { if (dragI !== null) e.preventDefault(); });
  body.addEventListener('drop', e => { if (dragI === null) return; e.preventDefault(); const row = e.target.closest('#typeRows .fld'); if (!row) { dragI = null; return; } const to = [...row.parentNode.children].indexOf(row); const from = dragI; dragI = null; moveType(from, to); });
  body.addEventListener('click', async e => {
    const up = e.target.closest('[data-up]'); if (up && !up.disabled){ moveType(+up.dataset.up, +up.dataset.up - 1); return; }
    const dn = e.target.closest('[data-dn]'); if (dn && !dn.disabled){ moveType(+dn.dataset.dn, +dn.dataset.dn + 1); return; }
    if (e.target.id === 'newTypeAdd'){ add(); return; }
    const d = e.target.closest('[data-del]'); if (!d || d.disabled) return;
    const t = typeList()[+d.dataset.del];
    if (!await confirmBox({ title: 'Delete type', message: `Delete the type “${t}”? No categories use it.`, ok: 'Delete', danger: true })) return;
    await run(() => saveTypes(typeList().filter(x => x !== t))); setTimeout(draw, 300); 
  });
  body.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'newTypeIn') add(); });
  openModal({ title: 'Category types', body, actions: [{ label: 'Done', primary: true, onClick: closeModal }] });
}
