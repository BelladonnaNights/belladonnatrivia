    if (b.dataset.a === 'export'){ closeModal(); exportCSV(); }
    if (b.dataset.a === 'recount'){ closeModal(); await run(async () => { const snap = await getCountFromServer(query(qColl(), where('categoryId', '==', c.id), where('archived', '==', false))); await updateDoc(catRef(c.id), { questionCount: snap.data().count }); toast(`Recounted: ${snap.data().count} questions`); }); }
    if (b.dataset.a === 'archive'){ closeModal(); await run(() => updateDoc(catRef(c.id), { archived: !c.archived, updatedAt: serverTimestamp() })); }
    if (b.dataset.a === 'delete'){ closeModal(); askDeleteCategory(c); }
  });
});

function askDeleteCategory(c){
  const body = document.createElement('div');
  body.innerHTML = `<p class="hint">This permanently deletes <strong style="color:var(--text)">${esc(c.name)}</strong> and <strong style="color:var(--text)">every question in it</strong>, including archived ones. It can’t be undone.</p>
    <label class="fld">Type the category name to confirm<input type="text" id="delConfirm" autocomplete="off"></label>
    <div class="msg" id="delMsg"></div>`;
  const actions = [{ label: 'Cancel', onClick: closeModal }, { label: 'Delete forever', danger: true, onClick: () => go() }];
  openModal({ title: 'Delete category?', body, actions });
  const cancel = actions[0].el, btn = actions[1].el; btn.disabled = true;
  $('#delConfirm').focus();
  $('#delConfirm').addEventListener('input', e => { btn.disabled = normName(e.target.value) !== normName(c.name); });
  async function go(){
    btn.disabled = true; cancel.disabled = true;
    const msg = $('#delMsg'); msg.className = 'msg ok'; msg.textContent = 'Deleting…';
    dropSub(c.id);
    if (S.curId === c.id){ S.curId = null; S.rows = new Map(); LS.set('lastCat', null); showEditor(false); renderSide(); }
    let n = 0;
    try {
      for (;;){
        const snap = await getDocs(query(qColl(), where('categoryId', '==', c.id), limit(400)));
        if (snap.empty) break;
        const batch = writeBatch(db); snap.docs.forEach(d => batch.delete(d.ref)); await batch.commit();
        n += snap.size; msg.textContent = `Deleted ${n.toLocaleString()} questions…`;
      }
      await deleteDoc(catRef(c.id));
      msg.textContent = `Done — removed the category and ${n.toLocaleString()} question${n === 1 ? '' : 's'}.`;
      btn.textContent = 'Close'; btn.classList.remove('danger'); btn.classList.add('primary'); btn.disabled = false; btn.onclick = closeModal;
    } catch (err){
      console.error(err); msg.className = 'msg';
      msg.textContent = (/permission/i.test(err.message) ? 'Firestore blocked the delete — check the rules are published.' : 'Stopped: ' + err.message) + ` (${n.toLocaleString()} questions removed so far — run it again to finish.)`;
      cancel.disabled = false; btn.disabled = false;
    }
  }
}

function exportCSV(){
  const c = S.cats.get(S.curId); if (!c) return;
  const items = [...S.rows.values()].filter(r => r.persisted && !r.data.archived).sort((a, b) => (Number(a.data.order) || 0) - (Number(b.data.order) || 0)).map(r => r.data);
  const blob = new Blob([toCSV(allCols(), items)], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = c.name.replace(/[\/\\:*?"<>|]+/g, '-') + '.csv';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

async function saveCustom(list){ await setDoc(doc(db, 'triviaConfig', 'columns'), { custom: list, updatedAt: serverTimestamp() }, { merge: true }); }
async function saveOrder(keys){ S.order = keys; await setDoc(doc(db, 'triviaConfig', 'columns'), { order: keys, updatedAt: serverTimestamp() }, { merge: true }); }

$('#colsBtn').addEventListener('click', openColumns);
function openColumns(){
  const body = document.createElement('div');
  const draw = () => {
    body.innerHTML = `<p class="hint">Tick the columns you want to see. Custom columns you add here become a field on every question.</p>
      ${S.tempOrder ? `<div class="hint" style="margin:0 0 10px;padding:8px 10px;border:1px solid var(--gold-glow);border-radius:8px">You've rearranged the columns on the main page for now. <button class="linkbtn" id="makePerm">Make this arrangement permanent</button></div>` : ''}
      <p class="hint" style="margin-top:0">Drag ⠿ or use ▲ ▼ to set the permanent column order — it's saved for everyone and every device. Question always stays first.</p>
      <div class="list" id="colList">` + orderCols(S.order).map((c, i, arr) => {
        const custom = S.custom.some(x => x.key === c.key) && !BUILTIN.some(b => b.key === c.key);
        const pinned = c.key === 'question';
        return `<div class="item" data-k="${c.key}" ${pinned ? '' : 'draggable="true"'}><span class="grab" title="${pinned ? 'Pinned first' : 'Drag to move'}">${pinned ? '📌' : '⠿'}</span><label style="display:flex;gap:10px;align-items:center;flex:1"><input type="checkbox" data-vis="${c.key}" ${c.key === 'question' ? 'checked disabled' : (S.hidden.has(c.key) ? '' : 'checked')}><span class="lb">${esc(c.label)}${custom ? ` <small>${CUSTOM_TYPES[c.type] || ''}</small>` : ''}</span></label>${custom ? `<button class="linkbtn" data-ren="${c.key}">Rename</button><button class="linkbtn" data-rm="${c.key}">Remove</button>` : ''}${pinned ? '' : `<button class="mv" data-mv="-1:${c.key}" ${i <= 1 ? 'disabled' : ''} title="Move left">▲</button><button class="mv" data-mv="1:${c.key}" ${i === arr.length - 1 ? 'disabled' : ''} title="Move right">▼</button>`}</div>`;
      }).join('') + `</div>
      <div style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px">
        <label class="fld">Add a column<input type="text" id="ncolName" placeholder="e.g. Host notes" autocomplete="off"></label>
        <label class="fld">Kind<select id="ncolType">${Object.entries(CUSTOM_TYPES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
        <button class="btn primary" id="ncolAdd">Add column</button>
        <div class="msg" id="ncolMsg"></div>
      </div>`;
  };
  draw();
  openModal({ title: 'Columns', body, actions: [{ label: 'Done', primary: true, onClick: closeModal }], onClose: () => renderAll() });
  body.addEventListener('change', e => { const k = e.target.dataset.vis; if (!k) return; e.target.checked ? S.hidden.delete(k) : S.hidden.add(k); LS.set('hiddenCols', [...S.hidden]); });
  const permKeys = () => orderCols(S.order).map(c => c.key).filter(k => k !== 'question');
  const commitOrder = async keys => { S.tempOrder = null; await run(() => saveOrder(keys)); draw(); };
  body.addEventListener('click', async e => {
    if (e.target.id === 'makePerm'){ await commitOrder(allCols().map(c => c.key).filter(k => k !== 'question')); return; }
    const mv = e.target.dataset.mv; if (!mv) return;
    const [d, k] = mv.split(':'), keys = permKeys(), i = keys.indexOf(k), j = i + (+d);
    if (i < 0 || j < 0 || j >= keys.length) return;
    keys.splice(j, 0, keys.splice(i, 1)[0]); await commitOrder(keys);
  });
  let dragK = null;
  body.addEventListener('dragstart', e => { const it = e.target.closest('.item[data-k]'); if (!it || it.dataset.k === 'question') return; dragK = it.dataset.k; it.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragK); } catch (_) {} });
  body.addEventListener('dragover', e => { if (!dragK) return; const it = e.target.closest('.item[data-k]'); if (!it || it.dataset.k === dragK) return; e.preventDefault(); $$('.item.dropT', body).forEach(x => x.classList.remove('dropT')); it.classList.add('dropT'); });
  body.addEventListener('drop', async e => {
    if (!dragK) return; const it = e.target.closest('.item[data-k]'); if (!it) return; e.preventDefault();
    const keys = permKeys().filter(k => k !== dragK), t = it.dataset.k, i = t === 'question' ? 0 : keys.indexOf(t);
    keys.splice(i, 0, dragK); dragK = null; await commitOrder(keys);
  });
  body.addEventListener('dragend', () => { dragK = null; $$('.item.dragging,.item.dropT', body).forEach(x => x.classList.remove('dragging', 'dropT')); });
  body.addEventListener('click', async e => {
    const rn = e.target.dataset.ren, rm = e.target.dataset.rm;
    if (rn){ const c = S.custom.find(x => x.key === rn); const t = await askText({ title: 'Rename column', label: 'Column name', value: c.label }); if (t) await run(async () => { await saveCustom(S.custom.map(x => x.key === rn ? { ...x, label: t } : x)); setTimeout(draw, 250); }); }
    if (rm){ const c = S.custom.find(x => x.key === rm); if (await confirmBox({ title: 'Remove column?', message: `"${c.label}" will disappear from the editor. The data already saved on questions is kept.`, ok: 'Remove', danger: true })) await run(async () => { await saveCustom(S.custom.filter(x => x.key !== rm)); setTimeout(draw, 250); }); }
    if (e.target.id === 'ncolAdd'){
      const label = $('#ncolName', body).value.trim(), type = $('#ncolType', body).value, msg = $('#ncolMsg', body);
      if (!label) { msg.textContent = 'Name the column.'; return; }
      if (allCols().some(c => norm(c.label) === norm(label))) { msg.textContent = 'There\u2019s already a column with that name.'; return; }
      const taken = new Set(allCols().map(c => c.key));
      await run(async () => { await saveCustom([...S.custom, { key: keyFromLabel(label, taken), label, type }]); setTimeout(draw, 250); });
    }
  });
}

/* ═══════════════════════════════════════════════════════════
   9. CSV IMPORT (many files at once)
   ═══════════════════════════════════════════════════════════ */
const existingCache = new Map();
async function ensureExisting(catId){
  if (!existingCache.has(catId)){
    const snap = await getDocs(query(qColl(), where('categoryId', '==', catId)));
    existingCache.set(catId, snap.docs.map(d => d.data()));
  }
  return existingCache.get(catId);
}

function openImport(){
  existingCache.clear();
  const st = { entries: [], ctx: { custom: S.custom, pending: new Map() }, ver: 0, busy: false };
  const body = document.createElement('div');
  body.innerHTML = `
    <p class="hint">In Google Sheets, open a category tab → <strong>File → Download → Comma-separated values (.csv)</strong>. Download as many as you like, then drop them all here. The category name comes from the file name — fix any that look off. Duplicates of questions already in a category are skipped.</p>
    <div class="drop" id="impDrop"><input type="file" id="impFiles" multiple accept=".csv,text/csv"><div class="muted" style="margin-top:8px;font-size:12px">…or drag CSV files onto this box</div></div>
    <label class="fld" style="max-width:300px">Type for new categories
      <select id="impType">${typeList().map(t => `<option ${S.cats.get(S.curId)?.type === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>
    <div id="impPv"></div><div id="impNote" class="hint"></div><div class="msg" id="impMsg"></div>`;
  const actions = [{ label: 'Cancel', onClick: closeModal }, { label: 'Import', primary: true, onClick: () => doImport() }];
  openModal({ title: 'Import CSVs', body, wide: true, actions });
  const importBtn = actions[1].el; importBtn.disabled = true;

  async function addFiles(files){
    for (const f of files){
      if (!/\.csv$/i.test(f.name) && f.type !== 'text/csv') continue;
      const text = await f.text();
      const parsed = recordsFromCSV(parseCSV(text), st.ctx);
      st.entries.push({ file: f.name, name: nameFromFile(f.name), type: $('#impType').value, parsed });
    }
    recompute();
  }
  $('#impFiles').addEventListener('change', e => addFiles([...e.target.files]));
  const drop = $('#impDrop');
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => addFiles([...e.dataTransfer.files]));
  $('#impType').addEventListener('change', e => { st.entries.forEach(en => { if (!catByNorm(en.name)) en.type = e.target.value; }); recompute(); });

  async function recompute(){
    const my = ++st.ver, seen = new Map();
    for (const en of st.entries){
      en.toAdd = []; en.dupCount = 0; en.status = '';
      if (en.parsed.error){ en.status = en.parsed.error; continue; }
      const key = normName(en.name), cat = catByNorm(en.name);
      if (!seen.has(key)){
        const set = new Set();
        if (cat){ const ex = await ensureExisting(cat.id); ex.forEach(q => set.add(normQ(q.question))); if (my !== st.ver) return; }
        seen.set(key, { set, used: false });
      }
      const g = seen.get(key);
      for (const rec of en.parsed.records){ const k = normQ(rec.question); if (g.set.has(k)) en.dupCount++; else { g.set.add(k); en.toAdd.push(rec); } }
      en.status = isGenericName(en.name) ? 'Needs a real category name' : cat ? `Adds to existing` : g.used ? 'Merges with file above' : 'New category';
      if (en.parsed.layout) en.status += ' · ' + en.parsed.layout;
      g.used = true;
    }
    if (my !== st.ver) return;
    drawPreview();
  }
  function drawPreview(){
    const act = document.activeElement;
    const keep = act && act.dataset && act.dataset.f === 'name' ? { i: act.dataset.i, s: act.selectionStart, e: act.selectionEnd } : null;
    const types = typeList();
    const ok = st.entries.filter(e => !e.parsed.error);
    const newQ = ok.reduce((n, e) => n + e.toAdd.length, 0), dups = ok.reduce((n, e) => n + e.dupCount, 0);
    $('#impPv').innerHTML = st.entries.length ? `<table class="pv"><thead><tr><th>File</th><th>Category name</th><th style="width:140px">Type</th><th>New</th><th title="New questions with an IMG URL">Img</th><th title="New questions with a SOUND URL">Sound</th><th>Skipped</th><th>Status</th><th></th></tr></thead><tbody>` +
      st.entries.map((e, i) => `<tr><td class="muted" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(e.file)}">${esc(e.file)}</td>
        <td><input data-i="${i}" data-f="name" class="${isGenericName(e.name) ? 'bad' : ''}" value="${esc(e.name)}"></td>
        <td><select data-i="${i}" data-f="type">${types.map(t => `<option ${t === e.type ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></td>
        <td class="${e.parsed.error ? 'bad' : 'good'}">${e.parsed.error ? '—' : e.toAdd.length}</td>
        <td>${e.parsed.error ? '' : e.toAdd.filter(r => r.imgUrl).length}</td>
        <td>${e.parsed.error ? '' : e.toAdd.filter(r => r.soundUrl).length}</td>
        <td class="muted" title="duplicates / blank rows / rows without a question">${e.parsed.error ? '' : (e.dupCount + e.parsed.blank + e.parsed.noQ)}</td>
        <td class="${e.parsed.error || isGenericName(e.name) ? 'bad' : ''}">${esc(e.status)}</td>
        <td><button class="linkbtn" data-rm="${i}">remove</button></td></tr>`).join('') + `</tbody></table>` : '';
    const newCols = [...new Map(ok.flatMap(e => e.parsed.newCols).map(c => [c.key, c])).values()];
    const generic = ok.filter(e => isGenericName(e.name)).length;
    const merging = ok.filter(e => e.status === 'Merges with file above').length;
    $('#impNote').innerHTML = st.entries.length ? `<strong>${ok.length}</strong> file${ok.length === 1 ? '' : 's'} · <strong>${newQ.toLocaleString()}</strong> new questions · ${dups.toLocaleString()} duplicates skipped` +
      (newCols.length ? `<br>Extra columns found: ${newCols.map(c => `<strong>${esc(c.label)}</strong>`).join(', ')} — they'll be added as custom columns.` : '') +
      (merging ? `<br><span style="color:var(--gold2)">${merging} file${merging === 1 ? '' : 's'} share a category name with another file and will be merged into it. If that's not what you want, rename them.</span>` : '') +
      (generic ? `<br><span style="color:var(--danger)">${generic} file${generic === 1 ? ' has' : 's have'} a generic name like "Sheet1". Type the real category name before importing.</span>` : '') : '';
    importBtn.disabled = (!newQ && !newCols.length) || generic > 0;
    if (keep){ const el = $(`#impPv input[data-f="name"][data-i="${keep.i}"]`); if (el){ el.focus(); try { el.setSelectionRange(keep.s, keep.e); } catch (e) {} } }
  }
  $('#impPv').addEventListener('input', e => { const i = e.target.dataset.i; if (i === undefined) return; if (e.target.dataset.f === 'name') { st.entries[i].name = e.target.value; clearTimeout(st.t); st.t = setTimeout(recompute, 450); } });
  $('#impPv').addEventListener('change', e => { const i = e.target.dataset.i; if (i !== undefined && e.target.dataset.f === 'type') st.entries[i].type = e.target.value; });
  $('#impPv').addEventListener('click', e => { const i = e.target.dataset.rm; if (i === undefined) return; st.entries.splice(Number(i), 1); recompute(); });

  async function doImport(){
    if (st.busy) return; st.busy = true; importBtn.disabled = true;
    const msg = $('#impMsg'); msg.className = 'msg ok';
    const ok = st.entries.filter(e => !e.parsed.error && e.name.trim());
    try {
      const newCols = [...new Map(ok.flatMap(e => e.parsed.newCols).map(c => [c.key, c])).values()].map(({ key, label, type }) => ({ key, label, type }));
      if (newCols.length) await saveCustom([...S.custom, ...newCols]);
      const groups = new Map();
      ok.forEach(e => { const k = normName(e.name); if (!groups.has(k)) groups.set(k, { name: e.name.trim(), type: e.type, adds: [] }); groups.get(k).adds.push(...e.toAdd); });
      let done = 0, total = 0;
      for (const [k, g] of groups){
        msg.textContent = `Importing ${++done} of ${groups.size}: ${g.name}…`;
        let cat = catByNorm(g.name), id, order = 1;
        if (cat){ id = cat.id; const ex = await ensureExisting(id); order = ex.reduce((m, q) => Math.max(m, Number(q.order) || 0), 0) + 1; }
        else { const ref = await addDoc(collection(db, 'triviaCategories'), { name: g.name, type: g.type, questionCount: 0, archived: false, createdAt: serverTimestamp(), updatedAt: serverTimestamp() }); id = ref.id; mirrorNewVaultCategory(id, g.name, g.type); }
        for (let i = 0; i < g.adds.length; i += 250){
          const batch = writeBatch(db);
          g.adds.slice(i, i + 250).forEach(rec => batch.set(doc(qColl()), { ...rec, categoryId: id, order: order++, archived: false, createdAt: serverTimestamp(), updatedAt: serverTimestamp() }));
          await batch.commit();
        }
        if (g.adds.length) await updateDoc(catRef(id), { questionCount: increment(g.adds.length), archived: false, updatedAt: serverTimestamp() });
        total += g.adds.length;
      }
      msg.textContent = `Done — ${total.toLocaleString()} questions imported into ${groups.size} categor${groups.size === 1 ? 'y' : 'ies'}.`;
      importBtn.textContent = 'Close'; importBtn.disabled = false; importBtn.onclick = closeModal;
      if (S.curId) { const cur = S.curId; S.curId = null; selectCategory(cur); }
    } catch (err){
      console.error(err); msg.className = 'msg';
      msg.textContent = /permission/i.test(err.message) ? 'Firestore blocked the import — publish the updated rules first.' : 'Import stopped: ' + err.message + ' (anything already written is saved; re-running skips duplicates).';
      importBtn.disabled = false;
    } finally { st.busy = false; }
  }
}

/* ═══════════════════════════════════════════════════════════
   10. SEARCH BY TAG ACROSS ALL CATEGORIES
   ═══════════════════════════════════════════════════════════ */
$('#tagSearchBtn').addEventListener('click', () => {
  const body = document.createElement('div');
  body.innerHTML = `<label class="fld">Tags — a question must have all of them (separate with commas)<input type="text" id="tsIn" placeholder="e.g. halloween, easy" autocomplete="off"></label><div id="tsOut"></div>`;
  openModal({ title: 'Search by tag', body, wide: true, actions: [{ label: 'Close', onClick: closeModal }, { label: 'Search', primary: true, onClick: go }] });
  const inp = $('#tsIn'); inp.focus(); inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  async function go(){
    const tags = parseTags(inp.value), out = $('#tsOut'); if (!tags.length) return;
    out.innerHTML = '<p class="hint">Searching…</p>';
    try {
      const snap = await getDocs(query(qColl(), where('tags', 'array-contains', tags[0]), limit(500)));
      const hits = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(q => !q.archived && tags.every(t => (q.tags || []).includes(t)));
      hits.sort((a, b) => String(S.cats.get(a.categoryId)?.name || '').localeCompare(String(S.cats.get(b.categoryId)?.name || '')) || (a.order || 0) - (b.order || 0));
      if (!hits.length){ out.innerHTML = '<p class="hint">No questions have all of those tags.</p>'; return; }
      out.innerHTML = `<p class="hint">${hits.length} question${hits.length === 1 ? '' : 's'}${snap.size >= 500 ? ' (showing the first 500 matches for the first tag)' : ''}. Click a row to open its category.</p>
        <table class="pv"><thead><tr><th>Category</th><th>Question</th><th>Answer</th><th>Diff</th><th>Tags</th></tr></thead><tbody>` +
        hits.map(q => `<tr class="hit" data-cat="${esc(q.categoryId)}"><td>${esc(S.cats.get(q.categoryId)?.name || '—')}</td><td>${esc(q.question)}</td><td>${esc(q.answer)}</td><td>${q.difficulty ?? ''}</td><td class="muted">${esc((q.tags || []).join(', '))}</td></tr>`).join('') + '</tbody></table>';
      $$('tr.hit', out).forEach(tr => tr.addEventListener('click', () => { closeModal(); selectCategory(tr.dataset.cat); }));
    } catch (e){ out.innerHTML = `<p class="msg">${esc(/permission/i.test(e.message) ? 'Firestore blocked that — publish the updated rules.' : e.message)}</p>`; }
  }
});
